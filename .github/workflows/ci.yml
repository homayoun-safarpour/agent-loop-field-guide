name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Test contract checker
        run: pytest -q
      - name: Filled samples pass the checker
        run: |
          python scripts/check_contract.py templates/sample_filled.md
          python scripts/check_contract.py templates/sample_ci_triage.md
      - name: The blank template is refused until it is filled
        run: |
          set +e
          python scripts/check_contract.py templates/LOOP_CONTRACT.md
          test $? -eq 2
